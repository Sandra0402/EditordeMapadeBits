<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Árbol de Navidad</title>
<link rel="stylesheet" href="arbol.css">
</head>
<body>

<!-- MENSAJE DE FELIZ NAVIDAD -->
<div id="mensajeNavidad">¡FELIZ NAVIDAD! 🎉🎄</div>

<!-- LUNA -->
<div class="luna"></div>

<!-- SANTA -->
<div id="santa">🎅🦌🦌</div>

<!-- NIEVE -->
<div class="nieve"></div>

<!-- ÁRBOL (CAPAS SUAVES) -->
<div id="arbol">
    <div class="estrellaC">★</div>

    <!-- Capas de menor a mayor -->
    <div class="capa" style="--w:100px"></div>
    <div class="capa" style="--w:140px"></div>
    <div class="capa" style="--w:180px"></div>
    <div class="capa" style="--w:220px"></div>
    <div class="capa" style="--w:260px"></div>
    <div class="capa" style="--w:300px"></div>

    <div class="troncoC"></div>
</div>

<!-- REGALOS -->
<div class="regalos">
    <div class="regalo" onclick="abrirRegalo(1)"></div>
    <div class="regalo" onclick="abrirRegalo(2)"></div>
    <div class="regalo" onclick="abrirRegalo(3)"></div>
</div>

<div id="msg1" class="mensaje">🎁 ¡Feliz Navidad! 🎄</div>
<div id="msg2" class="mensaje">✨ Mucho amor y alegría ✨</div>
<div id="msg3" class="mensaje">⭐ Que tus sueños se cumplan ⭐</div>

<!-- CASAS -->
<div class="casas">
    <div class="casa"><div class="techo"></div></div>
    <div class="casa"><div class="techo"></div></div>
    <div class="casa"><div class="techo"></div></div>
</div>

<script src="arbol.js"></script>
</body>
</html>
